# Build and Deploy Template for DC API

AWSTemplateFormatVersion: "2010-09-09"
Transform:
  - AWS::Serverless-2016-10-31
  - AWS::LanguageExtensions
Description: dc-api-v2 API
Parameters:
  ApiConfigPrefix:
    Type: String
    Description: Secret Name for API Configuration (if not provided, will use SecretsPath)
    Default: ""
  ApiTokenName:
    Type: String
    Description: Name of the jwt that DC API issues
  ApiTokenSecret:
    Type: String
    Description: Secret Key for Encrypting JWTs (must match IIIF server)
  ChatWebSocketURI:
    Type: String
    Description: URI of the chat websocket API
    Default: ""
  CustomDomainCertificateArn:
    Type: String
    Description: SSL Certificate for the Custom Domain Name
  CustomDomainZone:
    Type: String
    Description: Hosted Zone Name for Custom Domain
  CustomDomainHost:
    Type: String
    Description: Hostname within ApiDomainName for Custom Domain
  DcApiEndpoint:
    Type: String
    Description: URL for DC API
  DcUrl:
    Type: String
    Description: URL of Digital Collections website
  DeployChat:
    Type: String
    Description: Set to true to deploy Chat
  DevTeamNetIds:
    Type: String
    Description: Northwestern NetIDs of the development team
  EnvironmentPrefix:
    Type: String
    Description: Index Prefix
    Default: ""
  HoneybadgerApiKey:
    Type: String
    Description: Honeybadger API Key
    Default: ""
  HoneybadgerEnv:
    Type: String
    Description: Honeybadger Environment
    Default: ""
  HoneybadgerRevision:
    Type: String
    Description: Honeybadger Revision
    Default: ""
  ProviderCapabilities:
    Type: String
    Description: Currently enabled features per auth provider
    Default: |
      {"magic":["chat"],"nusso":["chat"]}
  PyramidBucket:
    Type: String
    Description: Meadow Pyramid Bucket
  ReadingRoomIPs:
    Type: String
    Description: Comma-delimited list of IP addresses to serve private resources to
  RepositoryEmail:
    Type: String
    Description: Verified email address to use as sender
  SecretsPath:
    Type: String
    Description: Prefix to use when loading configs from Secrets Manager
  SecretsPolicy:
    Type: String
    Description: Policy that allows reading of required secrets
  WriteConfigSecret:
    Type: String
    Description: Set to something other than "true" to _not_ write configuration secrets
    Default: "true"
Conditions:
  CustomConfigSecret:
    Fn::Not:
      - Fn::Equals:
          - !Ref ApiConfigPrefix
          - ""
  DeployChat:
    Fn::Equals: [!Ref DeployChat, "true"]
  HoneybadgerDisabled:
    Fn::Equals:
      - !Ref HoneybadgerApiKey
      - ""
  WriteSecret:
    Fn::Equals:
      - !Ref WriteConfigSecret
      - true
Resources:
  apiConfiguration:
    Type: AWS::SecretsManager::Secret
    Condition: WriteSecret
    Properties:
      Name:
        Fn::If:
          - CustomConfigSecret
          - !Sub "${ApiConfigPrefix}/config/dcapi"
          - !Sub "${SecretsPath}/config/dcapi"
      SecretString:
        Fn::ToJsonString:
          api_token_secret: !Ref ApiTokenSecret
          base_url: !Sub "https://${CustomDomainHost}.${CustomDomainZone}/api/v2"
  readIndexPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ESHTTPPolicy
            Effect: Allow
            Action:
              - es:ESHttp*
            Resource: "*"
  mcpFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../mcp
      Handler: mcp/lambda.handler
      Runtime: nodejs24.x
      Environment:
        Variables:
          SECRETS_PATH: !Ref SecretsPath
      Timeout: 30
      MemorySize: 256
      Policies:
        - !Ref SecretsPolicy
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref dcApi
            Path: /mcp
            Method: any
    Metadata:
      BuildMethod: makefile
  # V2 API
  apiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Description: |
        Main API handler for DC API v2. This function is responsible for routing requests to the appropriate 
        function based on the path and method.
      CodeUri: .
      Handler: index.handler
      Runtime: nodejs24.x
      Timeout: 10
      MemorySize: 512
      Environment:
        Variables:
          API_CONFIG_PREFIX: !Ref ApiConfigPrefix
          API_TOKEN_NAME: !Ref ApiTokenName
          CHAT_FEEDBACK_BUCKET: !Ref chatFeedbackBucket
          CHAT_FEEDBACK_TOPIC_ARN: !Ref chatFeedbackTopic
          DC_API_ENDPOINT: !Ref DcApiEndpoint
          DC_URL: !Ref DcUrl
          DEFAULT_SEARCH_SIZE: "100"
          DEV_TEAM_NET_IDS: !Ref DevTeamNetIds
          ENV_PREFIX: !Ref EnvironmentPrefix
          HONEYBADGER_DISABLED: !If [HoneybadgerDisabled, "true", "false"]
          HONEYBADGER_API_KEY:
            Fn::If:
              - HoneybadgerDisabled
              - AWS::NoValue
              - !Ref HoneybadgerApiKey
          HONEYBADGER_ENV:
            Fn::If:
              - HoneybadgerDisabled
              - AWS::NoValue
              - !Ref HoneybadgerEnv
          HONEYBADGER_REVISION:
            Fn::If:
              - HoneybadgerDisabled
              - AWS::NoValue
              - !Ref HoneybadgerRevision
          MAGIC_LINK_EMAIL_TEMPLATE: !Ref magicLinkEmailTemplate
          PROVIDER_CAPABILITIES: !Ref ProviderCapabilities
          READING_ROOM_IPS: !Ref ReadingRoomIPs
          REPOSITORY_EMAIL: !Ref RepositoryEmail
          SECRETS_PATH: !Ref SecretsPath
          WEBSOCKET_URI: !Ref ChatWebSocketURI
      Policies:
        - !Ref SecretsPolicy
        - !Ref readIndexPolicy
        - Version: 2012-10-17
          Statement:
            - Sid: ExecuteAVDownloadStepFunction
              Effect: Allow
              Action:
                - states:StartExecution
              Resource:
                - "*"
            - Sid: BucketAccess
              Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${PyramidBucket}/*"
            - Sid: ESHTTPPolicy
              Effect: Allow
              Action:
                - es:ESHttp*
              Resource: "*"
            - Sid: SendMagicLinkEmail
              Effect: Allow
              Action:
                - ses:SendTemplatedEmail
              Resource:
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/${RepositoryEmail}"
                - !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:template/${AWS::StackName}-magic-link-template"
      Events:
        ApiEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref dcApi
            Path: /{proxy+}
            Method: any
    Metadata:
      BuildMethod: makefile
  chatFeedbackBucket:
    Type: "AWS::S3::Bucket"
  chatFeedbackTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: DC Chat Feedback
      TopicName: !Sub "${AWS::StackName}-chat-feedback"
  dcApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: v2
      StageVariables:
        basePath: api/v2
  apiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      DomainName: !Sub "${CustomDomainHost}.${CustomDomainZone}"
      ApiMappingKey: api/v2
      ApiId: !Ref dcApi
      Stage: !Ref dcApiv2Stage
  magicLinkEmailTemplate:
    Type: AWS::SES::Template
    Properties:
      Template:
        TemplateName: !Sub "${AWS::StackName}-magic-link-template"
        SubjectPart: "Login Link for NUL Digital Collections"
        TextPart: |
          Hello,

          You recently requested a login link for NUL Digital Collections. Click the link below to log in,
          or copy and paste it into your browser's address bar:

          {{magicLink}}

          This link provides access to AI search functionality only and does not grant access to restricted collections.

          This link will expire in 15 minutes.

          If you did not request this email, you can safely ignore it.

          Thank you,
          The NUL Digital Collections Team
        HtmlPart: |
          <!DOCTYPE html PUBLIC '-//W3C//DTD XHTML 1.0 Transitional//EN' 'http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd'>
          <html xmlns='http://www.w3.org/1999/xhtml'>
            <head>
              <meta http-equiv='Content-Type' content='text/html; charset=utf-8' />
