openapi: 3.0.1
components:
  parameters:
    models:
      name: models
      in: path
      description: Comma-delimited list of models to search
      required: true
      schema:
        type: array
        items:
          type: string
          enum:
            - collections
            - file-sets
            - works
      style: simple
    id:
      name: id
      in: path
      required: true
      description: Collection, FileSet, or Work ID
      schema:
        type: string
        format: uuid
    query:
      name: query
      in: query
      required: false
      description: Keyword query
      schema:
        type: string
    searchToken:
      name: searchToken
      in: query
      required: false
      description: Search token from previous search response
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      description: Page number of results to retrieve
      schema:
        type: integer
        minimum: 1
    size:
      name: size
      in: query
      required: false
      description: Maximum number of results per page
      schema:
        type: integer
        minimum: 0
    sort:
      name: sort
      in: query
      required: false
      description: Comma-delimited list of fields to sort search results (e.g. "create_date:asc,modified_date:desc")
      schema:
        type: string
    _source_excludes:
      name: _source_excludes
      in: query
      required: false
      description: Comma-delimited list of fields to exclude from search results (e.g. "embedding,embedding_text_length")
      schema:
        type: string
    _source_includes:
      name: _source_includes
      in: query
      required: false
      description: Comma-delimited list of fields to include in search results (e.g. "title,accession_number")
      schema:
        type: string
    accept:
      name: accept
      in: header
      required: false
      description: Desired response content type
      schema:
        type: string
        enum:
          - application/json # Same as query parameter "as=opensearch"
          - application/ld+json # Same as query parameter "as=iiif"
          - 'application/ld+json;profile="http://iiif.io/api/presentation/3/context.json"' # Same as query parameter "as=iiif"
          - application/c2pa # Same as query parameter "as=c2pa"
          - application/premis+xml # Same as query parameter "as=premis"
    as:
      name: as
      in: query
      required: false
      description: >-
        Desired output format. `c2pa` and `premis` apply to single works only:
        `c2pa` returns a signed C2PA Manifest Store (`application/c2pa`) bound to
        the body of the default response, and `premis` returns PREMIS 3.0 XML
        describing the AI provenance of the work's metadata (or Meadow's
        PREMIS-shaped JSON projection with `Accept: application/json`).
      schema:
        type: string
        enum:
          - opensearch
          - iiif
          - c2pa
          - premis
    thumbnailAspect:
      name: aspect
      in: query
      required: false
      description: Desired aspect ratio
      schema:
        type: string
        enum:
          - full
          - square
    thumbnailSize:
      name: size
      in: query
      required: false
      description: Size of largest dimension
      schema:
        type: integer
        minimum: 1
        maximum: 300
    visibility:
      name: visibility
      in: query
      required: false
      description: Filter search results by visibility
      explode: false
      schema:
        type: array
        items:
          type: string
          enum:
            - public
            - institution
            - private
  responses:
    DocumentResponse:
      description: A single document response
      content:
        'application/ld+json; profile="http://iiif.io/api/presentation/3/context.json"':
          schema:
            $ref: "#/components/schemas/IiifPresentationManifest"
        application/json:
          schema:
            $ref: "#/components/schemas/IndexDocument"
    AnnotationsResponse:
      description: Annotations for a FileSet
      content:
        'application/ld+json; profile="http://iiif.io/api/presentation/3/context.json"':
          schema:
            $ref: "#/components/schemas/IiifPresentationManifest"
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: "./data-types.yaml#/components/schemas/Annotation"
                nullable: true
              info:
                $ref: "./data-types.yaml#/components/schemas/Info"
    AnnotationResponse:
      description: A single annotation response
      content:
        'application/ld+json; profile="http://iiif.io/api/presentation/3/context.json"':
          schema:
            $ref: "#/components/schemas/IiifPresentationManifest"
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: "./data-types.yaml#/components/schemas/Annotation"
              info:
                $ref: "./data-types.yaml#/components/schemas/Info"
    SearchResponse:
      description: A page of search results
      content:
        'application/ld+json; profile="http://iiif.io/api/presentation/3/context.json"':
          schema:
            $ref: "#/components/schemas/IiifPresentationManifest"
        application/json:
          schema:
            $ref: "#/components/schemas/OpenSearchResponse"
  schemas:
    IiifPresentationManifest:
      type: object
      description: A [IIIF Presentation v3.x](https://iiif.io/api/presentation/3.0/) Manifest
    IndexDocument:
      description: >-
        A single index document. Regular document responses and search results
        include the `ai_provenance` summary but omit `ai_provenance_exports`,
        including on nested annotations. Retrieve the full work provenance
        exports with `/works/{id}?as=premis` or `/works/{id}?as=c2pa`.
      oneOf:
        - $ref: "./data-types.yaml#/components/schemas/Collection"
        - $ref: "./data-types.yaml#/components/schemas/FileSet"
        - $ref: "./data-types.yaml#/components/schemas/Work"
    OpenSearchResponse:
      type: object
      properties:
        data:
          type: array
          items:
            oneOf:
              - $ref: "./data-types.yaml#/components/schemas/Annotation"
              - $ref: "#/components/schemas/IndexDocument"
          description: An array of response documents
        pagination:
          $ref: "./data-types.yaml#/components/schemas/PaginationInfo"
        info:
          $ref: "./data-types.yaml#/components/schemas/Info"
